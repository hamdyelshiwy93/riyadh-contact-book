for(const n of [...new Set(records.flatMap(people))].sort())sender.add(new Option(n,n));for(const n of [...new Set(records.map(r=>r.company).filter(Boolean))].sort())company.add(new Option(n,n));$('total').textContent=records.length;
function draw(){const q=search.value.trim().toLowerCase();const found=records.filter(r=>(!q||[r.name,r.company,r.title].join(' ').toLowerCase().includes(q))&&(!sender.value||people(r).includes(sender.value))&&(!company.value||r.company===company.value));$('result-count').textContent=`${found.length} of ${records.length} contacts · A–Z by company`;cards.innerHTML=found.length?found.map(r=>{const num=r.mobile||r.companyPhone;const initials=name(r).split(/\s+/).filter(Boolean).slice(0,2).map(v=>v[0]).join('');const flag=r.id==='CS-003'?'Phone to confirm':['CS-004','CS-015'].includes(r.id)?'Possible duplicate':'';return `<article class="contact"><div class="company">${escape(r.company||'Company not recorded')}</div><div class="identity"><div class="avatar" aria-hidden="true">${escape(initials)}</div><div><h2>${escape(name(r))}</h2><p class="role">${escape(r.title||'Role not recorded')}</p></div></div><div class="ways"><div class="way"><span>${r.companyPhone?'Office':'Phone'}</span>${num?`<a href="tel:${escape(num)}">${escape(format(num))}</a>`:`<div class="no-data">${r.id==='CS-003'?'Number needs confirmation':'Not provided'}</div>`}</div><div class="way"><span>Email</span>${r.email?`<a href="mailto:${escape(r.email)}">${escape(r.email)}</a>`:'<div class="no-data">Not provided</div>'}</div></div><div class="shared">Shared by<b>${escape(r.sender)}</b></div><div class="bottom">${flag?`<span class="tag">${flag}</span>`:'<span></span>'}<button class="detail" data-open="${r.id}" aria-label="View details for ${escape(name(r))}">View contact ↗</button></div></article>`}).join(''):'<div class="empty"><h2>No contacts found.</h2><p>Try another name or reset the filters.</p></div>';}
function open(r,button){lastTrigger=button;let nums=[];if(r.mobile)nums.push(['Mobile / personal contact',r.mobile]);if(r.office)nums.push(['Office line',r.office]);if(r.companyPhone)nums.push(['Company / shared number'+(r.ext?' · ext. '+r.ext:''),r.companyPhone]);const urls=[r.web,...r.social.split('\n')].filter(Boolean);const urlMarkup=urls.map(raw=>{let u=raw.replace(/^Company:\s*/,'');if(u.startsWith('@'))return `<span>${escape(u)}</span>`;if(!/^https?:\/\//.test(u))u='https://'+u;try{const parsed=new URL(u);if(!['https:','http:'].includes(parsed.protocol))return '';}catch{return '';}return `<a href="${escape(u)}" target="_blank" rel="noopener noreferrer">${escape(raw)} ↗</a>`}).join('');$('dialog-content').innerHTML=`<div class="dialog-top"><button class="close" aria-label="Close contact">×</button><div class="company">${escape(r.company||'Company not recorded')}</div><h2 id="person-name">${escape(name(r))}</h2><p class="role">${escape(r.title||'Role not recorded')}</p></div><div class="dialog-body"><section class="section"><h3>Contact details</h3>${nums.map(([label,n])=>`<div class="number"><div><small>${escape(label)}</small><a href="tel:${escape(n)}">${escape(format(n))}</a></div><button class="copy" data-copy="${escape(n)}">Copy number</button></div>`).join('')}${!nums.length?'<p class="fine">No confirmed phone number available.</p>':''}${r.email?`<div class="number"><a href="mailto:${escape(r.email)}">${escape(r.email)}</a><button class="copy" data-copy="${escape(r.email)}">Copy email</button></div>`:''}<div class="status" id="copy-status" aria-live="polite"></div></section>${r.notes?`<section class="section"><h3>Meeting notes</h3><p>${escape(r.notes)}</p></section>`:''}${r.action?`<section class="section"><h3>Follow-up</h3><p>${escape(r.action)}</p></section>`:''}${r.review?`<section class="section"><h3>To keep in mind</h3><p class="warning">${escape(r.review)}</p></section>`:''}${urlMarkup?`<section class="section"><h3>Online</h3><div class="links">${urlMarkup}</div></section>`:''}<section class="section"><h3>Shared by</h3><p>${escape(r.sender)}</p></section></div>`;dialog.showModal();}
cards.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)open(records.find(r=>r.id===b.dataset.open),b)});dialog.addEventListener('click',async e=>{if(e.target.closest('.close'))dialog.close();const b=e.target.closest('[data-copy]');if(!b)return;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(b.dataset.copy);else{const t=document.createElement('textarea');t.value=b.dataset.copy;dialog.append(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw new Error('copy');}b.textContent='Copied';$('copy-status').textContent='Copied to clipboard.';}catch{$('copy-status').textContent='Copy unavailable. Select and copy the contact detail above.'}});dialog.addEventListener('close',()=>lastTrigger?.focus());search.addEventListener('input',draw);sender.addEventListener('change',draw);company.addEventListener('change',draw);$('reset').addEventListener('click',()=>{search.value='';sender.value='';company.value='';draw()});draw();})();
</script></body></html>
